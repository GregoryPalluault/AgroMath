#screen-shape{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;background:radial-gradient(ellipse at 50% 30%,#67ab3f 0%,#3f8236 60%,#2c5f2b 100%);}
#screen-shape{display:none;}
.t-label{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.25em;color:#eaf5da;text-transform:uppercase;}
h1.title{font-weight:900;font-size:clamp(3rem,7vw,5.5rem);letter-spacing:-.02em;line-height:1;color:#fbfdf4;text-shadow:0 3px 14px rgba(0,0,0,.25);}
h1.title span{color:#ffd24d;}
.t-desc{color:#eaf3dc;font-size:.95rem;max-width:460px;text-align:center;line-height:1.7;}
.btn{background:var(--green);color:#fff;border:1px solid var(--green-l);border-radius:6px;font-family:'Lato';
  font-weight:700;font-size:1rem;letter-spacing:.04em;padding:13px 44px;cursor:pointer;transition:background .15s,transform .1s;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.btn:hover{background:var(--green-l);}.btn:active{transform:scale(.98);}
.btn-lg{font-size:1.35rem;padding:17px 60px;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.35);}
.finish-box{background:rgba(31,42,24,.82);border:1px solid var(--green-l);border-radius:14px;padding:26px 34px;
  display:flex;flex-direction:column;align-items:center;gap:16px;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.5);}
.finish-box .t-label{color:#cfe6b4;}
.finish-box h1.title{color:#fbfdf4;}
.finish-box .t-desc{color:#e8f2da;}
.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:760px;width:92vw;}
.shape-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:border-color .15s,background .15s,transform .1s;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.shape-card:hover{border-color:var(--green);background:#fff;transform:translateY(-2px);}
.shape-card.locked{opacity:.6;cursor:not-allowed;}
.shape-card.locked:hover{border-color:var(--border);background:var(--panel);transform:none;}
.shape-card svg{width:96px;height:66px;}
.sc-name{font-size:1.15rem;font-weight:900;color:var(--green-d);}
.sc-shape{font-size:.82rem;font-weight:700;color:var(--text);margin-top:-4px;}
.sc-sub{font-size:.72rem;color:var(--dim);text-align:center;}
#screen-game{display:none;position:absolute;inset:0;}
#canvas-container{position:absolute;inset:0;overflow:hidden;}
#hud{position:absolute;top:0;left:0;right:0;height:64px;z-index:10;
  background:linear-gradient(180deg,rgba(253,248,236,.97),rgba(253,248,236,.82));border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.hud-lvl{font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;color:var(--green-d);text-transform:uppercase;white-space:nowrap;}
.hud-sep{width:1px;height:30px;background:var(--border);}
.hud-obj{font-size:.92rem;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.hud-tool{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--gold-d);background:rgba(224,164,28,.16);
  border:1px solid var(--border);border-radius:4px;padding:4px 9px;white-space:nowrap;font-weight:600;}
.hud-prog{display:flex;align-items:center;gap:8px;}
.prog-track{width:120px;height:8px;background:#e3d8bd;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;background:var(--ok);border-radius:3px;transition:width .2s;}
.prog-pct{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--dim);width:38px;text-align:right;}
#dim-badge{position:absolute;top:72px;left:14px;background:rgba(253,248,236,.92);border:1px solid var(--border);
  border-radius:6px;padding:7px 13px;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--gold-d);
  pointer-events:none;line-height:1.6;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.12);}
#hud-stack-br{position:absolute;bottom:12px;right:12px;z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#controls{background:rgba(253,248,236,.94);border:1px solid var(--border);
  border-radius:6px;padding:10px 15px;font-size:.84rem;color:var(--dim);line-height:1.75;box-shadow:0 2px 8px rgba(0,0,0,.12);}
#controls b{color:var(--gold-d);}
#cam-reset{background:rgba(253,248,236,.95);
  border:1px solid var(--gold-d);border-radius:6px;padding:9px 15px;font-size:.86rem;font-weight:700;
  color:var(--gold-d);cursor:pointer;user-select:none;transition:background .12s;box-shadow:0 2px 8px rgba(0,0,0,.12);}
#cam-reset:hover{background:rgba(224,164,28,.18);}
#cam-view{background:rgba(253,248,236,.95);
  border:1px solid var(--green);border-radius:6px;padding:9px 15px;font-size:.86rem;font-weight:700;
  color:var(--green-d);cursor:pointer;user-select:none;transition:background .12s;box-shadow:0 2px 8px rgba(0,0,0,.12);}
#cam-view:hover{background:rgba(108,191,55,.2);}
#sound-btn{background:rgba(253,248,236,.95);
  border:1px solid var(--border);border-radius:6px;padding:9px 13px;font-size:1.05rem;
  cursor:pointer;user-select:none;transition:background .12s;box-shadow:0 2px 8px rgba(0,0,0,.12);}
#sound-btn:hover{background:rgba(0,0,0,.06);}
#tip{position:absolute;bottom:12px;left:12px;z-index:10;background:rgba(253,248,236,.95);border:1px solid var(--border);
  border-radius:6px;padding:10px 16px;font-size:.88rem;color:var(--text);max-width:400px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.12);}
#tip b{color:var(--gold-d);}
.modal{display:none;position:fixed;inset:0;background:rgba(20,30,15,.55);z-index:200;align-items:center;justify-content:center;}
.modal.active{display:flex;}
#modal-q{background:transparent;justify-content:flex-start;padding-left:2vw;pointer-events:none;}
#modal-q .q-box{pointer-events:auto;}
.q-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px 30px;max-width:480px;width:92vw;box-shadow:0 24px 60px rgba(0,0,0,.35);}
.q-tag{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green-d);margin-bottom:10px;}
.q-intro{font-size:.9rem;color:var(--text);line-height:1.55;margin-bottom:14px;padding-left:12px;border-left:3px solid var(--green);font-style:italic;}
.q-schema{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-family:'IBM Plex Mono',monospace;
  font-size:.76rem;color:var(--gold-d);line-height:1.7;margin-bottom:14px;white-space:pre-wrap;}
.q-text{font-size:1rem;font-weight:700;margin-bottom:16px;line-height:1.45;}
.q-input-row{display:flex;gap:8px;align-items:center;}
.q-input{flex:1;background:#fff;border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-family:'IBM Plex Mono',monospace;font-size:1.1rem;padding:11px 14px;outline:none;}
.q-input:focus{border-color:var(--green);}
.q-unit{font-family:'IBM Plex Mono',monospace;font-size:.9rem;color:var(--dim);min-width:48px;}
.q-submit{background:var(--green);border:none;border-radius:6px;color:#fff;font-weight:700;font-size:.9rem;padding:11px 22px;cursor:pointer;}
.q-submit:hover{background:var(--green-l);}
.q-hints{margin-top:12px;}
.hint-btn{background:transparent;border:1px dashed var(--gold-d);border-radius:6px;color:var(--gold-d);font-family:'Lato';
  font-size:.78rem;font-weight:700;padding:7px 14px;cursor:pointer;transition:background .12s;}
.hint-btn:hover{background:rgba(224,164,28,.12);}.hint-btn:disabled{opacity:.4;cursor:not-allowed;}
.hint-warn{font-size:.68rem;color:var(--dim);margin-top:6px;}
.hint-text{display:none;margin-top:8px;padding:9px 12px;background:rgba(224,164,28,.12);border-left:2px solid var(--gold);
  border-radius:0 4px 4px 0;font-size:.82rem;color:var(--text);line-height:1.5;}
.hint-text.show{display:block;animation:hintIn .2s ease;}
@keyframes hintIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.q-fb{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;min-height:20px;color:var(--green-d);}
.q-fb.bad{color:var(--danger);}
.end-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:34px 38px;max-width:400px;width:92vw;
  text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .25s cubic-bezier(.34,1.5,.64,1);}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.end-tag{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.18em;color:var(--green-d);text-transform:uppercase;margin-bottom:8px;}
.end-title{font-size:1.6rem;font-weight:900;margin-bottom:4px;}
.end-stars{font-size:2.2rem;letter-spacing:6px;margin:14px 0;color:var(--gold);}
.end-stats{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--dim);line-height:1.9;margin-bottom:20px;text-align:left;
  white-space:pre-wrap;background:var(--bg);border-radius:4px;padding:10px 14px;border:1px solid var(--border);}
.info-box{background:var(--panel);border:2px solid var(--green);border-radius:14px;padding:34px 40px;max-width:460px;width:92vw;
  text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:pop .25s cubic-bezier(.34,1.5,.64,1);}
.info-icon{font-size:3.4rem;line-height:1;margin-bottom:10px;}
.info-title{font-size:1.7rem;font-weight:900;color:var(--gold-d);margin-bottom:12px;}
.info-text{font-size:1.12rem;color:var(--text);line-height:1.6;margin-bottom:24px;}
.info-text b{color:var(--green-d);}
</style>
</head>

<audio id="ambient" loop preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════ OUTILS ═══════════
function fmt(n){const r=Math.round(n*100)/100;return r%1===0?r.toString():r.toString().replace('.',',');}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function r1(n){return Math.round(n*10)/10;}
function pointSegDist(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz;
  let t=l2?((px-ax)*dx+(pz-az)*dz)/l2:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),pz-(az+t*dz));
}
function shapeUnlocked(id){
  if(id==='rect') return true;
  if(id==='trap') return shapeDone('rect');
  if(id==='tri') return shapeDone('trap');
  return false;
}
function shapeDone(id){
  try{ if(localStorage.getItem('agromath_'+id+'Done')==='1') return true; }catch(e){}
  return !!sessionDone[id];
}
let sessionDone={};
function markShapeDone(id){ sessionDone[id]=true; try{localStorage.setItem('agromath_'+id+'Done','1');}catch(e){} }

// ═══════════ AUDIO ═══════════
let audioCtx=null, masterGain=null, engine=null, muted=false, lastTool=0;
let ambientBuf=null, ambientGain=null, ambientStarted=false;
const AMBIENT_SRC='ambient.mp3';   // dépose ce fichier (boucle nature libre de droits) à côté du HTML
function initAudio(){
  if(audioCtx) return;
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  masterGain=audioCtx.createGain(); masterGain.gain.value=muted?0:1; masterGain.connect(audioCtx.destination);
}
async function startAmbient(){
  if(!audioCtx || ambientStarted) return;
  ambientStarted=true;
  try{
    const res=await fetch(AMBIENT_SRC); if(!res.ok){ ambientStarted=false; return; }
    ambientBuf=await audioCtx.decodeAudioData(await res.arrayBuffer());
  }catch(e){ ambientStarted=false; return; }   // fichier absent → pas d'ambiance
  ambientGain=audioCtx.createGain(); ambientGain.gain.value=0.22; ambientGain.connect(masterGain);
  scheduleAmbientLoop(audioCtx.currentTime+0.1);
}
// Boucle avec chevauchement : fondu en sortie mixé au fondu en entrée (raccord inaudible)
function scheduleAmbientLoop(startAt){
  if(!ambientBuf||!ambientGain) return;
  const dur=ambientBuf.duration, xf=Math.min(2.5, dur*0.35);
  const src=audioCtx.createBufferSource(); src.buffer=ambientBuf;
  const g=audioCtx.createGain(); src.connect(g); g.connect(ambientGain);
  g.gain.setValueAtTime(0.0001,startAt);
  g.gain.linearRampToValueAtTime(1,startAt+xf);            // fondu en entrée
  g.gain.setValueAtTime(1,startAt+dur-xf);
  g.gain.linearRampToValueAtTime(0.0001,startAt+dur);      // fondu en sortie
  src.start(startAt); src.stop(startAt+dur+0.1);
  src.onended=()=>{ try{src.disconnect(); g.disconnect();}catch(e){} };
  const nextAt=startAt+dur-xf;                             // la boucle suivante démarre pendant le fondu
  setTimeout(()=>scheduleAmbientLoop(nextAt), Math.max(50,(nextAt-audioCtx.currentTime-0.25)*1000));
}
function startEngine(){
  if(!audioCtx||engine) return;
  const filter=audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=500; filter.Q.value=5;
  const gain=audioCtx.createGain(); gain.gain.value=0.045;
  const o1=audioCtx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=48;
  const o2=audioCtx.createOscillator(); o2.type='square'; o2.frequency.value=96;
  const og2=audioCtx.createGain(); og2.gain.value=0.35;
  o1.connect(filter); o2.connect(og2); og2.connect(filter); filter.connect(gain); gain.connect(masterGain);
  o1.start(); o2.start(); engine={o1,o2,filter,gain};
}
function stopEngine(){ if(engine){ try{engine.o1.stop();engine.o2.stop();}catch(e){} engine=null; } }
function updateEngine(thr){
  if(!engine||!audioCtx) return;
  const t=audioCtx.currentTime, f=48+thr*82;
  engine.o1.frequency.setTargetAtTime(f,t,0.07);
  engine.o2.frequency.setTargetAtTime(f*2.01,t,0.07);
  engine.filter.frequency.setTargetAtTime(380+thr*1100,t,0.07);
  engine.gain.gain.setTargetAtTime(0.045+thr*0.11,t,0.09);
}
function noiseBurst(dur,freq,type,vol){
  if(!audioCtx) return;
  const n=Math.floor(audioCtx.sampleRate*dur), buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const flt=audioCtx.createBiquadFilter(); flt.type=type||'lowpass'; flt.frequency.value=freq||800; flt.Q.value=1.2;
  const g=audioCtx.createGain(); g.gain.value=vol||0.14;
  src.connect(flt); flt.connect(g); g.connect(masterGain); src.start();
}
function thunk(){
  if(!audioCtx) return;
  const t=audioCtx.currentTime, o=audioCtx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(60,t+0.12);
  const g=audioCtx.createGain(); g.gain.setValueAtTime(0.24,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(t+0.17);
}
function playToolSound(work){
  if(!audioCtx) return;
  const now=performance.now(); if(now-lastTool<110) return; lastTool=now;
  if(work==='plow') noiseBurst(0.17,320,'lowpass',0.16);
  else if(work==='seed') noiseBurst(0.10,1500,'bandpass',0.09);
  else if(work==='harvest') noiseBurst(0.14,1000,'highpass',0.12);
  else if(work==='fence') thunk();
}
function toggleMute(){
  muted=!muted;
  if(masterGain) masterGain.gain.value=muted?0:1;
  const a=document.getElementById('ambient'); if(a) a.muted=muted;
  const b=document.getElementById('sound-btn'); if(b) b.textContent=muted?'🔇':'🔊';
}

// ═══════════ FORMES (rectangle + deux rectangles) ═══════════
const SHAPE_DEFS={
  rect:{
    label:"Champ rectangulaire",
    hasPyth:false,
    hasCost:false,
    hasTrig:false,
    hasVolume:false,
    poly:(hx,hz)=>[{x:-hx,z:-hz},{x:hx,z:-hz},{x:hx,z:hz},{x:-hx,z:hz}],
    build(){
      let L=pick([120,150,180,200,160]), l=pick([80,100,120,90,110]); if(l>L){const t=L;L=l;l=t;}
      const area=L*l, perim=2*(L+l), diag=r1(Math.sqrt(L*L+l*l));
      return {area_m2:area, badge:`Rectangle ${L} × ${l} m`,
        dims:[{a:0,b:1,off:{x:0,z:-1},text:`L = ${L} m`},{a:1,b:2,off:{x:1,z:0},text:`l = ${l} m`}],
        geom:{
          area:{tag:"Géométrie · Aire",unit:"m²",schema:`Rectangle\n  Longueur L = ${L} m\n  Largeur l = ${l} m`,
            text:"Surface du champ, en m² ?",hints:["Il faut l'aire du rectangle.","Aire = Longueur × largeur."],
            answer:area,sol:`${L} × ${l} = ${area} m²`},
          perim:{tag:"Géométrie · Périmètre",unit:"m",schema:`Rectangle\n  Longueur L = ${L} m\n  Largeur l = ${l} m`,
            text:"Longueur de clôture pour entourer le champ ?",hints:["Il faut le périmètre.","2 longueurs + 2 largeurs."],
            answer:perim,sol:`2 × (${L} + ${l}) = ${perim} m`},
          pyth:{tag:"Géométrie · Pythagore",unit:"m",showTriangle:true,schema:`Triangle rectangle formé par L et l\n  L = ${L} m\n  l = ${l} m`,
            text:"Longueur de la diagonale du champ ?",hints:["La diagonale = hypoténuse du triangle (L, l).","Pythagore : d = √(L² + l²)."],
            answer:diag,sol:`√(${L}² + ${l}²) ≈ ${diag} m`}
        }};
    }
  },
  trap:{
    label:"Champ en trapèze rectangle",
    hasPyth:true,
    hasCost:true,
    hasTrig:false,
    hasVolume:false,
    poly:(hx,hz)=>[{x:-hx,z:-hz},{x:hx,z:-hz},{x:-hx+2*hx*0.55,z:hz},{x:-hx,z:hz}],
    build(){
      const B=pick([160,180,200]), b=pick([80,100,120]), h=pick([90,110,130]);
      const ob=r1(Math.sqrt(h*h+(B-b)*(B-b)));
      const area=(B+b)/2*h, perim=r1(B+b+h+ob);
      return {area_m2:area, badge:`Trapèze rect. B=${B} b=${b} h=${h} m`,
        dims:[{a:0,b:1,off:{x:0,z:-1},text:`B = ${B} m`},{a:3,b:2,off:{x:0,z:1},text:`b = ${b} m`},{a:0,b:3,off:{x:-1,z:0},text:`h = ${h} m`}],
        geom:{
          area:{tag:"Géométrie · Aire",unit:"m²",
            schema:`Trapèze rectangle\n  Grande base B = ${B} m\n  Petite base b = ${b} m\n  Hauteur h = ${h} m`,
            text:"Surface du champ, en m² ?",hints:["Aire = (grande base + petite base) ÷ 2 × hauteur.","Remplace B, b et h par les valeurs du schéma, puis calcule."],
            answer:area,sol:`(${B} + ${b}) ÷ 2 × ${h} = ${(B+b)/2} × ${h} = ${area} m²`},
          perim:{tag:"Géométrie · Périmètre",unit:"m",
            schema:`Trapèze rectangle\n  Grande base B = ${B} m\n  Petite base b = ${b} m\n  Hauteur (côté droit) = ${h} m\n  Côté oblique = ${ob} m`,
            text:"Longueur de clôture (périmètre) ?",hints:["Additionne les 4 côtés.","Périmètre = B + b + hauteur + côté oblique."],
            answer:perim,sol:`${B} + ${b} + ${h} + ${ob} = ${perim} m`},
          pyth:{tag:"Géométrie · Pythagore",unit:"m",showTriangle:true,
            schema:`Côté oblique du trapèze\n  Hauteur h = ${h} m\n  Écart des bases : B − b = ${B-b} m`,
            text:"Longueur du côté oblique ?",hints:["Triangle rectangle formé par la hauteur et l'écart des bases.","Pythagore : oblique = √(h² + (B − b)²)."],
            answer:ob,sol:`√(${h}² + ${B-b}²) ≈ ${ob} m`}
        }};
    }
  },
  tri:{
    label:"Champ en L (coin coupé)",
    hasPyth:true,
    hasCost:false,
    hasTrig:false,
    hasVolume:true,
    pythVerts:[5,1,2],   // [angle droit, extrémité 1 de l'hypoténuse, extrémité 2] — sommets réels, pas de projection
    poly:(hx,hz)=>{ const hxTop=0, sz=-1.2;  // sz aligné sur une frontière de la grille (ROWS=7, PS=2.4 fixes)
      return [{x:-hx,z:hz},{x:hxTop,z:hz},{x:hx,z:sz},{x:hx,z:-hz},{x:hxTop,z:-hz},{x:hxTop,z:sz},{x:-hx,z:sz}]; },
    subPolys:(hx,hz)=>{ const hxTop=0, sz=-1.2;
      return [
        [{x:-hx,z:hz},{x:hxTop,z:hz},{x:hx,z:sz},{x:-hx,z:sz}],          // pièce lointaine (trapèze avec coin coupé)
        [{x:hxTop,z:sz},{x:hx,z:sz},{x:hx,z:-hz},{x:hxTop,z:-hz}]        // pièce proche (rectangle, l'entrée)
      ]; },
    build(){
      const L=pick([100,120,140,160]), Hlow=pick([40,50,60,70]);
      const scale=pick([10,10,15]);
      const [lh,lm,lc]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]);
      const H=lh*scale, missing=lm*scale, hyp=lc*scale;
      const area=r1(H*(L+missing/2) + missing*Hlow);
      const perim=r1(2*L + hyp + 2*Hlow + missing + H);
      return {area_m2:area, badge:`Champ en L — L=${L} m, H=${H} m, hyp=${hyp} m`,
        dims:[
          {a:0,b:1,off:{x:0,z:1},text:`L = ${L} m`},
          {a:1,b:2,off:{x:1,z:0.4},text:`Hypoténuse = ${hyp} m`},
          {a:2,b:3,off:{x:1,z:0},text:`H2 = ${Hlow} m`},
          {a:4,b:5,off:{x:-1,z:0.3},text:`H2 = ${Hlow} m`},
          {a:5,b:6,off:{x:0,z:-1},text:`L = ${L} m`},
          {a:6,b:0,off:{x:-1,z:0},text:`H = ${H} m`}
        ],
        geom:{
          area:{tag:"Géométrie · Aire",unit:"m²",
            schema:`Champ en L\n  L = ${L} m\n  H = ${H} m\n  Petit côté (calculé) = ${missing} m\n  H2 = ${Hlow} m`,
            text:"Surface totale du champ, en m² ?",
            hints:["Découpe le champ en 2 morceaux : le grand trapèze et le petit rectangle.","Aire trapèze = (L + (L+petit côté)) ÷ 2 × H ; Aire rectangle = petit côté × H2 ; additionne les deux."],
            answer:area,sol:`Trapèze : (${L} + ${L+missing}) ÷ 2 × ${H} = ${r1(H*(L+missing/2))} m² ; Rectangle : ${missing} × ${Hlow} = ${missing*Hlow} m² ; total = ${area} m²`},
          perim:{tag:"Géométrie · Périmètre",unit:"m",
            schema:`Champ en L\n  L = ${L} m (×2)\n  H = ${H} m\n  H2 = ${Hlow} m (×2)\n  Hypoténuse = ${hyp} m\n  Petit côté (calculé) = ${missing} m`,
            text:"Longueur de clôture (périmètre) ?",
            hints:["Additionne les 7 côtés du contour, un par un.","Périmètre = 2×L + H + 2×H2 + hypoténuse + petit côté."],
            answer:perim,sol:`2×${L} + ${H} + 2×${Hlow} + ${hyp} + ${missing} = ${perim} m`},
          pyth:{tag:"Géométrie · Pythagore",unit:"m",showTriangle:true,
            schema:`Triangle rectangle formé par la hauteur et l'hypoténuse\n  H = ${H} m\n  Hypoténuse = ${hyp} m`,
            text:"Quelle est la longueur du petit côté manquant du champ ?",
            hints:["C'est un triangle rectangle : utilise le théorème de Pythagore.",`petit côté = √(hypoténuse² − H²) = √(${hyp}² − ${H}²).`],
            answer:missing,sol:`√(${hyp}² − ${H}²) = √${hyp*hyp-H*H} = ${missing} m`}
        }};
    }
  }
};

// ═══════════ PROPORTIONNALITÉ / FONCTIONS (m², sans hectare, sans durée) ═══════════
function buildProp(area){
  const consoOpts=[]; for(let i=17;i<=28;i++) consoOpts.push(i/10);
  const conso=pick(consoOpts), fioul=r1(conso*area/1000);
  const consoS=pick(consoOpts.filter(v=>v!==conso)), fioulS=r1(consoS*area/1000);   // fioul spécifique au semoir
  const Lr=pick([4000,5000,6000]), densite=pick([10,12,14]), grains=densite*Lr;
  const pct=pick([5,8,10,12,15,20]), extraGrains=grains*pct/100, totalGrains=grains+extraGrains;
  const rend=pick([400,500,600]), recolteKg=Math.round(rend*area/1000), recolteT=r1(recolteKg/1000);
  const capT=pick([8,10,12]), nbBennes=Math.ceil(recolteT/capT);
  const siloR=pick([2,2.5,3]), siloH=pick([5,6,7,8]), siloVol=r1(Math.PI*siloR*siloR*siloH);
  const cap=pick([8000,10000,12000]), nbRem=Math.ceil(recolteKg/cap);
  const cA=pick([0.05,0.06,0.08]), cB=pick([150,200,250]), cout=r1(cA*area+cB);
  const x0=pick([5000,6000,8000,10000,12000]), budget=r1(cA*x0+cB);   // problème inverse : résoudre C(x)=budget
  const prixT=pick([180,200,220]), recette=r1(prixT*recolteT), benefice=r1(recette-cout);
  const hoursOpts=[2,3,4].filter(hh=>area%hh===0);
  const hoursH=pick(hoursOpts.length?hoursOpts:[2]), debitH=Math.round(area/hoursH);   // durée exacte en heures
  return {conso,fioul,consoS,fioulS,Lr,densite,grains,pct,extraGrains,totalGrains,rend,recolteKg,recolteT,capT,nbBennes,siloR,siloH,siloVol,cap,nbRem,cA,cB,cout,x0,budget,prixT,recette,benefice,debitH,hoursH};
}

// ═══════════ NIVEAUX ═══════════
let SHAPE=null, SHAPE_GEOM=null, PROP=null, currentShapeId='rect';
function clone(o,extra){return Object.assign({},o,extra);}
function buildLevels(){
  const g=SHAPE_GEOM.geom, a=SHAPE_GEOM.area_m2, P=PROP;
  return [
   {name:"TRAVAIL N°1 · CLÔTURE", work:"fence", tool:"fence",
    tasks:[
      ...(SHAPE.hasPyth ? [clone(g.pyth,{intro: currentShapeId==='tri'
        ? "Le champ a la forme d'un rectangle avec un coin coupé et une extension. Avant de le clôturer, calcule la longueur du petit côté manquant (théorème de Pythagore)."

// ── Texture d'herbe procédurale (mouchetée, sans fichier externe) ──
let _grassTex=null;
function getGrassTexture(){
  if(_grassTex) return _grassTex;
  const size=512, c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
  g.fillStyle='#5c8a3a'; g.fillRect(0,0,size,size);
  // grandes taches de teinte variée (casse la répétition : vert, olive, jaune-vert, vert-bleuté)
  const hues=[0.28,0.24,0.22,0.32,0.26];
  for(let i=0;i<90;i++){
    const x=Math.random()*size, y=Math.random()*size, r=25+Math.random()*90;
    const h=hues[Math.floor(Math.random()*hues.length)]+(Math.random()-.5)*0.02;
    const l=0.38+Math.random()*0.16, s=0.4+Math.random()*0.25;
    const col=new THREE.Color().setHSL(h,s,l);
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,`rgba(${col.r*255|0},${col.g*255|0},${col.b*255|0},0.4)`);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  // bruit fin sur toute la texture (casse encore la régularité)
  for(let i=0;i<900;i++){
    const x=Math.random()*size, y=Math.random()*size, r=6+Math.random()*18;
    g.fillStyle=Math.random()<0.5?'rgba(70,105,40,0.12)':'rgba(140,175,90,0.12)';
    g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  // brins/mouchetures fines
  for(let i=0;i<2200;i++){
    const x=Math.random()*size, y=Math.random()*size;
    const dark=Math.random()<0.5;
    g.fillStyle=dark?'rgba(58,92,32,0.5)':'rgba(150,190,100,0.35)';
    g.fillRect(x,y,1+Math.random()*1.5,2+Math.random()*3);
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(8,8); tex.anisotropy=16;
  _grassTex=tex; return tex;
}
function makeSkyDome(){
  const geo=new THREE.SphereGeometry(500,24,16);
  const top=new THREE.Color(0x4f97d8), hor=new THREE.Color(0xdff0f7), below=new THREE.Color(0xbfd9a8);
  const pos=geo.attributes.position, col=[];
  for(let i=0;i<pos.count;i++){
    const y=Math.max(-1,Math.min(1,pos.getY(i)/500));
    let c;
    if(y>=0){ const t=Math.pow(y,0.55); c=hor.clone().lerp(top,t); }
    else { const t=Math.min(1,-y*3); c=hor.clone().lerp(below,t); }   // sous l'horizon : ton terreux, jamais noir
    col.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false,toneMapped:false}));
}
function makeSkyEquirect(){
  const c=document.createElement('canvas'); c.width=256; c.height=128; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,128);
  grd.addColorStop(0,'#3f86cf'); grd.addColorStop(0.55,'#bfe2f2'); grd.addColorStop(0.75,'#dff0e6'); grd.addColorStop(1,'#89a85a');
  g.fillStyle=grd; g.fillRect(0,0,256,128);
  const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}

// ── Contrôle caméra à la souris (orbite / zoom / pan) ──
function setupCameraControls(){
  const el=renderer.domElement;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('mousedown',e=>{ camDrag={x:e.clientX,y:e.clientY,btn:e.button}; });
  addEventListener('mouseup',()=>{ camDrag=null; });
  addEventListener('mousemove',e=>{
    if(!camDrag||!camOrbit) return;
    const dx=e.clientX-camDrag.x, dy=e.clientY-camDrag.y; camDrag.x=e.clientX; camDrag.y=e.clientY;
    if(camDrag.btn===2){ // pan
      const k=camOrbit.radius*0.0016;
      camOrbit.tx=clamp(camOrbit.tx + k*(-dx*Math.cos(camOrbit.theta)+dy*Math.sin(camOrbit.theta)),-40,40);
      camOrbit.tz=clamp(camOrbit.tz + k*( dx*Math.sin(camOrbit.theta)+dy*Math.cos(camOrbit.theta)),-40,40);
    } else { // orbite
      camOrbit.theta -= dx*0.005;
      camOrbit.phi = clamp(camOrbit.phi - dy*0.005, 0.12, 1.45);
    }
  });
  el.addEventListener('wheel',e=>{
    if(!camOrbit) return; e.preventDefault();
    camOrbit.radius = clamp(camOrbit.radius*(1+e.deltaY*0.0011), camOrbit.rmin, camOrbit.rmax);
  },{passive:false});
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function applyCamera(){
  const s=camOrbit;
  camera.position.set(
    s.tx + s.radius*Math.sin(s.phi)*Math.sin(s.theta),
    s.ty + s.radius*Math.cos(s.phi),
    s.tz + s.radius*Math.sin(s.phi)*Math.cos(s.theta));
  camera.lookAt(s.tx,s.ty,s.tz);
}

function pointInPoly(x,z,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,zi=poly[i].z,xj=poly[j].x,zj=poly[j].z;
    if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi)) inside=!inside;
  }
  return inside;
}

function buildScene(){
  [fieldGroup,decorGroup,guideGroup,diagonalMesh,dimAnnos,pythTri].forEach(o=>o&&scene.remove(o));
  if(tractor) scene.remove(tractor.group);
  diagonalMesh=null; dimAnnos=null; pythTri=null; parcels=[]; fenceSegments=[]; fencePlantedCount=0;
  if(fuelAnim){ scene.remove(fuelAnim.grp); fuelAnim=null; } if(toolAnim) toolAnim=null;
  crops=[]; pops=[]; grains.forEach(x=>scene.remove(x)); grains=[];
  COLS=9; ROWS=7;                          // champ agrandi (+1 case par côté)
  const fw=COLS*PS, fh=ROWS*PS, hx=fw/2, hz=fh/2;
  const x0=-fw/2+PS/2, z0=-fh/2+PS/2;
  const lvl=LEVELS[currentLevel];

  const minZ=Math.min(...shapePoly.map(p=>p.z));

  // chemin d'accès vers le portail
  const road=new THREE.Mesh(new THREE.PlaneGeometry(6,26),new THREE.MeshStandardMaterial({color:0x7a6238,roughness:1}));
  road.rotation.x=-Math.PI/2; road.position.set(0,-0.015,minZ-13); road.receiveShadow=true; decorGroup.add(road);
  buildLandscape(decorGroup,hx,hz,minZ);
  scene.add(decorGroup);

  // ── PARCELLES (cellules carrées à l'intérieur, découpées au contour sur les bords) ──
  fieldGroup=new THREE.Group();
  const subPolys = SHAPE.subPolys ? SHAPE.subPolys(hx,hz) : [shapePoly];
  const subWs = subPolys.map(sp=>polySignedArea(sp)>=0?1:-1);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cx=x0+c*PS, cz=z0+r*PS;
    let clip=null, bestArea=0;
    for(let s=0;s<subPolys.length;s++){
      const c=clipCell(cx,cz,subPolys[s],subWs[s]); if(!c) continue;
      const a=polyArea(c); if(a>bestArea){ bestArea=a; clip=c; }
    }
    if(!clip) continue;
    const area=bestArea;
    if(area < PS*PS*0.06) continue;                       // éclat trop petit → ignoré
    const full = clip.length===4 && area > PS*PS*0.9995;
    let mesh, px, pz;
    if(full){ mesh=makeParcel(lvl.work); mesh.position.set(cx,0,cz); px=cx; pz=cz; }
    else { mesh=makePolyParcel(clip, lvl.work); let sx=0,sz=0; clip.forEach(pt=>{sx+=pt.x;sz+=pt.z;}); px=sx/clip.length; pz=sz/clip.length; }
    mesh.receiveShadow=true; fieldGroup.add(mesh);
    const p={mesh,done:false,x:px,z:pz,work:lvl.work,crop:null,
      tileScale: full?1:Math.max(0.3,Math.min(1,Math.sqrt(area/(PS*PS))*1.1))};
    if(lvl.work==='harvest'){

  else { buildWallsAndFence(shapePoly, decorGroup); }

  // ── OUTILS (colonne à droite) + CITERNE (bas, au centre) ──

  // ── CAMÉRA ──

              tx:0,ty:0,tz:0, rmin:radius*0.45, rmax:radius*1.8};

function makeTree(x,z,scale=1,tone=0x5aa538){

// ── Style « illustration » pour les objets hero (tracteur, bâtiments) : toon shading + contour ──
let _toonGrad=null;
function getToonGradient(){
  if(_toonGrad) return _toonGrad;
  const c=document.createElement('canvas'); c.width=4; c.height=1; const g=c.getContext('2d');
  ['#2c2c2c','#707070','#ababab','#ffffff'].forEach((s,i)=>{g.fillStyle=s; g.fillRect(i,0,1,1);});
  const tex=new THREE.CanvasTexture(c);
  tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter; tex.generateMipmaps=false;
  _toonGrad=tex; return tex;
}
function toonMat(color,extra){ return new THREE.MeshToonMaterial(Object.assign({color,gradientMap:getToonGradient()},extra||{})); }
// Contour sombre (technique de la coque inversée) : ajouté après avoir construit l'objet
function addToonOutline(root,thickness,color){
  thickness=thickness||1.032; color=color||0x20180f;
  const outMat=new THREE.MeshBasicMaterial({color,side:THREE.BackSide,toneMapped:false});
  const toAdd=[];
  root.traverse(o=>{
    if(o.isMesh && !o.userData.noOutline){
      const m=new THREE.Mesh(o.geometry,outMat);
      m.scale.copy(o.scale).multiplyScalar(thickness);
      m.position.copy(o.position); m.rotation.copy(o.rotation);
      toAdd.push({parent:o.parent,mesh:m});
    }
  });
  toAdd.forEach(t=>t.parent.add(t.mesh));
}

function makeBarn(x,z,rot=0){
  const g=new THREE.Group();

  const W=6,D=4.4,H=3.2;

  body.position.y=H/2; body.castShadow=true; body.receiveShadow=true; g.add(body);
  // toit à deux pans (deux plaques inclinées) — géométrie simple et fiable, pas de risque d'orientation
  const halfW=W/2, roofH=1.5, overhang=0.5;

    p.rotation.z = sign>0 ? (Math.PI-angle0) : angle0;
    p.position.set(sign*halfW/2, H+roofH/2, 0);

  }
  slopePanel(1); slopePanel(-1);
  const ridge=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.28,D+overhang),roofMat);
  ridge.position.set(0,H+roofH,0); g.add(ridge);

  const gableMat=toonMat(0xd8402c,{emissive:0x3a0d08,emissiveIntensity:0.35,side:THREE.DoubleSide});

    const geo=new THREE.BufferGeometry();

    geo.setIndex([0,1,2]); geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,gableMat); m.castShadow=true; g.add(m);
  }

  door.position.set(0,1.2,D/2+0.02); g.add(door);

  const cy=new THREE.Mesh(new THREE.BoxGeometry(0.16,2.3,0.05),wmat); cy.position.set(0,1.2,D/2+0.09); g.add(cy);
  const d1=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.16,0.05),wmat); d1.position.set(0,1.2,D/2+0.09); d1.rotation.z=0.83; g.add(d1);
  const d2=d1.clone(); d2.rotation.z=-0.83; g.add(d2);
  addToonOutline(g);

  const loft=new THREE.Mesh(new THREE.BoxGeometry(1.2,1,0.3),toonMat(0x8a5a2a));
  loft.position.set(0,3.4,D/2-0.15); g.add(loft);
  const hay=new THREE.Mesh(new THREE.BoxGeometry(1,0.7,0.2),toonMat(0xd9b84a));
  hay.position.set(0,3.35,D/2-0.02); g.add(hay);
  g.position.set(x,0,z); g.rotation.y=rot; return g;
}

function spawnFlock(){
  const n=3+Math.floor(Math.random()*3), dir=Math.random()<0.5?1:-1;
  const y=18+Math.random()*6, z=-20+Math.random()*28, speed=(6+Math.random()*3)*dir;

function buildLandscape(group,hx,hz,minZ){
  windmills=[]; ducks=[]; clouds=[]; smokeSources=[]; trees=[]; hens=[];
  ambSmoke.forEach(m=>scene.remove(m)); ambSmoke=[]; smokeTimer=0;
  birds.forEach(b=>scene.remove(b)); birds=[]; birdTimer=6;
  const fx=0, fz=hz+9, frot=Math.PI;   // mur de façade aligné avec le début de l'herbe (bord du chemin de terre, agrandi)
  group.add(makeFarmhouse(fx,fz,frot)); group.add(makeGroundShadow(fx,fz,4.2));
  const lx=1.5,lz=0.7;
  smokeSources.push({x:fx+lx*Math.cos(frot)+lz*Math.sin(frot), y:5.4, z:fz-lx*Math.sin(frot)+lz*Math.cos(frot)});
  group.add(makeBarn(hx+14,-2,-Math.PI/2)); group.add(makeGroundShadow(hx+14,-2,4.6));
  group.add(makeSilo(hx+11,10)); group.add(makeSilo(hx+13.5,10.5)); group.add(makeGroundShadow(hx+12.2,10.2,2.4));
  group.add(makeWindmill(-hx-14,10)); group.add(makeGroundShadow(-hx-14,10,1.6));
  group.add(makePond(hx+16,-14));
  group.add(makeHayBale(hx+4,minZ-8)); group.add(makeHayBale(hx+5.6,minZ-8.4)); group.add(makeHayBale(hx+4.8,minZ-9.6));
  group.add(makeGroundShadow(hx+4.8,minZ-8.5,1.6));

  [[hx+9,-4.5],[hx+10.5,-1.5],[hx+13,-3.5],[hx+8,-2]].forEach(p=>{const h=makeHen(p[0],p[1]); group.add(h); hens.push({g:h,phase:Math.random()*6.28,bx:p[0],bz:p[1]});});
  // arbres variés en périphérie (mémorisés pour le balancement)
  const spots=[[-hx-9,-hz-4],[-hx-13,-hz+3],[hx+8,-hz-6],[hx+14,-hz-2],[-hx-16,hz-4],[-hx-12,hz+6],
    [hx+15,hz+4],[hx+18,hz-8],[-hx-6,hz+9],[6,hz+11],[-8,hz+12],[-hx-18,-2],[hx+20,2],[0,-hz-16]];
  spots.forEach((p,i)=>{ const r=i%3; const tree=(r===0?makePine(p[0],p[1],0.9+Math.random()*0.4)
      : makeTree(p[0],p[1],0.85+Math.random()*0.5, r===1?0x5aa538:0x6cb840));
      group.add(tree); group.add(makeGroundShadow(p[0],p[1],1.5)); trees.push({g:tree,phase:Math.random()*6.28,amp:0.02+Math.random()*0.02}); });
  [[-hx-4,hz+7],[hx+6,hz+8],[-hx-8,-hz-2],[hx+3,-hz-5],[10,hz+9]].forEach(p=>{group.add(makeBush(p[0],p[1])); group.add(makeGroundShadow(p[0],p[1],0.9));});
}
function spawnChimneySmoke(s){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.32,8,8),new THREE.MeshStandardMaterial({color:0xf0f0f0,transparent:true,opacity:.5,roughness:1}));
  m.position.set(s.x+(Math.random()-.5)*0.2,s.y,s.z+(Math.random()-.5)*0.2);
  m.userData={life:1,vy:0.7+Math.random()*0.3,drift:(Math.random()-.5)*0.3};
  scene.add(m); ambSmoke.push(m);
}
function updateAmbient(dt){
  const t=performance.now()*0.001;
  // fumée cheminée
  smokeTimer-=dt; if(smokeTimer<=0 && smokeSources.length){ smokeTimer=0.55; smokeSources.forEach(spawnChimneySmoke); }
  for(let i=ambSmoke.length-1;i>=0;i--){ const p=ambSmoke[i],u=p.userData; u.life-=dt*0.32;
    p.position.y+=u.vy*dt; p.position.x+=u.drift*dt; p.scale.multiplyScalar(1+dt*0.5); p.material.opacity=Math.max(0,u.life*0.5);
    if(u.life<=0){ scene.remove(p); p.geometry.dispose(); p.material.dispose(); ambSmoke.splice(i,1); } }
  // canards
  ducks.forEach(d=>{ d.g.position.x=d.bx+Math.sin(t*0.3+d.phase)*0.6; d.g.position.z=d.bz+Math.cos(t*0.25+d.phase)*0.5;
    d.g.position.y=0.08+Math.sin(t*1.4+d.phase)*0.04; d.g.rotation.y+=dt*0.15; });
  // balancement des arbres
  trees.forEach(tr=>{ tr.g.rotation.z=Math.sin(t*1.1+tr.phase)*tr.amp; tr.g.rotation.x=Math.cos(t*0.9+tr.phase)*tr.amp*0.6; });
  // poules qui picorent

  birdTimer-=dt; if(birdTimer<=0){ birdTimer=12+Math.random()*12; spawnFlock(); }

// ── Parcelle ──
function parcelColor(work,done){
  if(work==='fence') return 0x5a8a34;
  if(!done) return {plow:0x5a8a34,seed:0x6a4522,harvest:0xc7a828}[work];
  return {plow:0x4a2e12,seed:0x3a5a1e,harvest:0x8a6a1e}[work];
}
function makeParcel(work){
  const h=0.1;
  const m=new THREE.Mesh(new THREE.BoxGeometry(PS*0.97,h,PS*0.97),new THREE.MeshStandardMaterial({color:parcelColor(work,false),roughness:1}));
  m.position.y=h/2; return m;
}
// ── Découpe d'une cellule carrée au contour (Sutherland-Hodgman, polygone convexe) ──
function polySignedArea(poly){ let s=0; for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length]; s+=a.x*b.z-b.x*a.z;} return s/2; }
function polyArea(pts){ return Math.abs(polySignedArea(pts)); }
function _inside(P,A,B,ws){ return ((B.x-A.x)*(P.z-A.z)-(B.z-A.z)*(P.x-A.x))*ws >= -1e-6; }
function _isect(P,Q,A,B){
  const rx=Q.x-P.x, rz=Q.z-P.z, sx=B.x-A.x, sz=B.z-A.z, d=rx*sz-rz*sx;
  const t=((A.x-P.x)*sz-(A.z-P.z)*sx)/d;
  return {x:P.x+t*rx, z:P.z+t*rz};
}
function clipCell(cx,cz,poly,ws){
  let sub=[{x:cx-PS/2,z:cz-PS/2},{x:cx+PS/2,z:cz-PS/2},{x:cx+PS/2,z:cz+PS/2},{x:cx-PS/2,z:cz+PS/2}];
  for(let i=0;i<poly.length && sub.length;i++){
    const A=poly[i], B=poly[(i+1)%poly.length], out=[];
    for(let j=0;j<sub.length;j++){
      const P=sub[j], Q=sub[(j+1)%sub.length], ip=_inside(P,A,B,ws), iq=_inside(Q,A,B,ws);
      if(ip){ out.push(P); if(!iq) out.push(_isect(P,Q,A,B)); }
      else if(iq){ out.push(_isect(P,Q,A,B)); }
    }
    sub=out;
  }
  return sub.length>=3 ? sub : null;
}
// Parcelle plate épousant un polygone (cellule de bord découpée)
function makePolyParcel(pts, work){
  const h=0.1, shape=new THREE.Shape();
  shape.moveTo(pts[0].x, -pts[0].z);
  for(let i=1;i<pts.length;i++) shape.lineTo(pts[i].x, -pts[i].z);
  shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{depth:h,bevelEnabled:false,steps:1});
  geo.rotateX(-Math.PI/2);           // couche le prisme à plat (x,z inchangés, hauteur = y de 0 à h)
  return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:parcelColor(work,false),roughness:1}));
}

// ── Clôture + murs ──
function buildWallsAndFence(poly, group){
  walls=[]; gate=null;
  const minZ=Math.min(...poly.map(p=>p.z));
  const gw=PS*1.1;
  const postMat=new THREE.MeshStandardMaterial({color:0x6b4f2a,roughness:1});
  const railMat=new THREE.MeshStandardMaterial({color:0x7d5f34,roughness:1});
  function fenceRun(ax,az,bx,bz){
    walls.push({ax,az,bx,bz});
    const dx=bx-ax,dz=bz-az,len=Math.hypot(dx,dz),n=Math.max(1,Math.round(len/(PS*0.9)));
    for(let k=0;k<=n;k++){const t=k/n;const p=new THREE.Mesh(new THREE.BoxGeometry(0.16,1,0.16),postMat);
      p.position.set(ax+dx*t,0.5,az+dz*t); p.castShadow=true; group.add(p);}
    const rail=new THREE.Mesh(new THREE.BoxGeometry(len,0.1,0.06),railMat);
    rail.position.set((ax+bx)/2,0.66,(az+bz)/2); rail.rotation.y=-Math.atan2(dz,dx); rail.castShadow=true; group.add(rail);
  }
  for(let i=0;i<poly.length;i++){
    const A=poly[i], B=poly[(i+1)%poly.length];
    if(Math.abs(A.z-minZ)<0.01 && Math.abs(B.z-minZ)<0.01){       // arête proche → portail au milieu
      const midx=(A.x+B.x)/2, leftX=Math.min(A.x,B.x), rightX=Math.max(A.x,B.x);
      fenceRun(rightX,minZ, midx+gw,minZ);
      fenceRun(midx-gw,minZ, leftX,minZ);
      gate={x:midx,z:minZ,gw};
      [midx-gw,midx+gw].forEach(px=>{const pil=new THREE.Mesh(new THREE.BoxGeometry(0.3,1.5,0.3),new THREE.MeshStandardMaterial({color:0x4a3418,roughness:1}));
        pil.position.set(px,0.75,minZ); pil.castShadow=true; group.add(pil);});
    } else fenceRun(A.x,A.z,B.x,B.z);
  }
}
function buildFenceSegments(poly){
  fenceSegments=[]; fencePlantedCount=0; const spacing=PS*0.9; let order=0;
  for(let i=0;i<poly.length;i++){
    const A=poly[i],B=poly[(i+1)%poly.length],dx=B.x-A.x,dz=B.z-A.z,len=Math.hypot(dx,dz),n=Math.max(1,Math.round(len/spacing));
    for(let k=0;k<n;k++){const t=k/n;fenceSegments.push({x:A.x+dx*t,z:A.z+dz*t,done:false,mesh:null});}
  }
}
function drawGuide(poly){
  guideGroup=new THREE.Group();
  fenceSegments.forEach(s=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.5,6),
    new THREE.MeshStandardMaterial({color:0xe8d048,transparent:true,opacity:0.35,roughness:.6}));
    m.position.set(s.x,0.25,s.z); guideGroup.add(m); s.guide=m;});
  scene.add(guideGroup);
}
function plantFencePost(s){

  post.position.set(s.x,0.5,s.z); post.castShadow=true; fieldGroup.add(post); s.mesh=post;

// ═══════════ BOUCLE ═══════════
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min((now-lastTime)/1000,0.05); lastTime=now;
  updateTractor(dt); updateEffects(dt); updateCrops(dt); updateGrains(dt); updatePops(dt); updateToolAnim(dt); updateFuelAnim(dt);
  if(camIntro) updateCameraIntro(dt);
  else if(camMode==='driver' && tractor){ const d=driverPose(); camera.position.lerp(d.pos,0.18); camera.lookAt(d.look); }
  else if(camMode==='toDriver' && tractor){
    camTween.t+=dt; const u=Math.min(1,camTween.t/camTween.dur), e=1-Math.pow(1-u,3), d=driverPose();
    camera.position.lerpVectors(camTween.fromPos,d.pos,e);
    camera.lookAt(new THREE.Vector3().lerpVectors(camTween.fromLook,d.look,e));
    if(u>=1) camMode='driver';
  }
  else if(camOrbit) applyCamera();
  windmills.forEach(w=>w.userData.hub.rotation.z+=dt*0.6);
  updateAmbient(dt);
  updateToolLabels();
  if(renderer) renderer.render(scene,camera);
}
function lerpAngle(a,b,t){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*t;}

function updateTractor(dt){
  if(!tractor||!taskActive||levelDone||camIntro||toolAnim||fuelAnim) return;
  if(document.getElementById('modal-info').classList.contains('active')) return;
  const t=tractor;
  let v=0,turn=0;
  if(keys['arrowup']||keys['z']||keys['w']) v+=1;
  if(keys['arrowdown']||keys['s']) v-=1;
  if(keys['arrowleft']||keys['q']||keys['a']) turn+=1;
  if(keys['arrowright']||keys['d']) turn-=1;
  const SPEED=4.4, TURN=2.0;
  t.heading += turn*TURN*dt;                 // rotation possible même à l'arrêt
  // assistance : redresse doucement vers l'axe le plus proche quand on ne tourne pas
  if(turn===0 && v!==0){
    const step=Math.PI/2, nearest=Math.round(t.heading/step)*step;
    t.heading=lerpAngle(t.heading,nearest,Math.min(1,4*dt));
  }
  const mv=v*SPEED*dt;
  const nx=t.x+Math.sin(t.heading)*mv, nz=t.z+Math.cos(t.heading)*mv;
  moveWithCollision(t,nx,nz);
  t.group.position.set(t.x,0,t.z); t.group.rotation.y=t.heading;
  if(mv!==0){ t.wheelSpin+=mv*1.8; t.group.userData.wheels.forEach(w=>w.rotation.x=t.wheelSpin);
    t.group.position.y=Math.sin(t.wheelSpin*3)*0.012; if(Math.random()<0.5) spawnSmoke(t); }
  tryLoadTool(v<0);
  const need=LEVELS[currentLevel].tool;
  if(t.tool===need){
    if(!t.refueled) tryRefuel();
    else doWork(t, mv!==0);
  }
}
function tryRefuel(){
  if(!cistern || fuelAnim) return;
  if(Math.hypot(tractor.x-cistern.x,tractor.z-cistern.z)<3.6){
    startRefuelAnim();

}
// Animation ~2 s : pistolet + tuyau de la pompe vers le tracteur
function startRefuelAnim(){
  const px=cistern.x+1.95, py=1.0, pz=cistern.z;      // buse de la pompe
  const Rx=Math.cos(tractor.heading), Rz=-Math.sin(tractor.heading);   // côté droit du tracteur
  const s=(Rx*(px-tractor.x)+Rz*(pz-tractor.z))>=0?1:-1;               // côté tourné vers la pompe
  const off=0.9, nx=tractor.x+Rx*off*s, ny=1.15, nz=tractor.z+Rz*off*s; // orifice sur le flanc
  const grp=new THREE.Group();
  const dark=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.85});
  const dx=nx-px, dy=ny-py, dz=nz-pz, len=Math.hypot(dx,dy,dz);
  const hose=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,len,8),dark);
  hose.position.set((px+nx)/2,(py+ny)/2,(pz+nz)/2);
  hose.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());
  grp.add(hose);
  const gun=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.42),dark); gun.position.set(nx,ny,nz); grp.add(gun);
  const trig=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.24,0.1),new THREE.MeshStandardMaterial({color:0xd83a2a,roughness:.7}));
  trig.position.set(nx,ny-0.16,nz-0.12); grp.add(trig);
  scene.add(grp);
  fuelAnim={grp,t:0,dur:2.0};
  setObjective("⛽ Remplissage du réservoir…");
  flashTip("⛽ Remplissage du réservoir…");
  playToolSound('seed');  // léger « souffle » de remplissage
}
function updateFuelAnim(dt){
  if(!fuelAnim) return;
  fuelAnim.t+=dt;
  fuelAnim.grp.position.y=Math.sin(fuelAnim.t*22)*0.012;   // légère vibration
  if(fuelAnim.t>=fuelAnim.dur){
    scene.remove(fuelAnim.grp); fuelAnim=null;
    tractor.refueled=true;
    setObjective("🚜 Entre par le portail et travaille tout le champ.");
    showInfo('🚜','Plein effectué !',"Le réservoir est plein. Entre dans le champ par le <b>portail</b> et travaille toute la parcelle !",()=>startDriverView());

function moveWithCollision(t,nx,nz){
  if(canBeAt(nx,nz)){t.x=nx;t.z=nz;return;}
  if(canBeAt(nx,t.z)){t.x=nx;return;}
  if(canBeAt(t.x,nz)){t.z=nz;return;}
}
function canBeAt(x,z){
  for(const w of walls){ if(pointSegDist(x,z,w.ax,w.az,w.bx,w.bz)<TRACT_R) return false; }
  return true;
}
function tryLoadTool(reversing){
  if(tractor.toolLocked || !reversing) return;           // ne s'attelle qu'en marche arrière
  const need=LEVELS[currentLevel].tool;
  const rd=1.8, rx=tractor.x-Math.sin(tractor.heading)*rd, rz=tractor.z-Math.cos(tractor.heading)*rd;  // point d'attelage (arrière)
  let near=null, bd=LOAD_R;
  for(const s of toolStations){ const d=Math.hypot(rx-s.x,rz-s.z); if(d<bd){ bd=d; near=s; } }
  if(!near || tractor.tool===near.type) return;         // rien derrière, ou déjà cet outil
  if(tractor.toolMesh){ tractor.group.userData.anchor.remove(tractor.toolMesh); tractor.toolMesh=null; }
  tractor.tool=near.type;
  document.getElementById('hud-tool').textContent='Outil : '+TOOL_LABEL[near.type];
  if(near.type===need){
    tractor.toolLocked=true;                            // verrouillé : plus de changement par erreur
    if(near.groundMesh) near.groundMesh.visible=false;   // l'outil disparaît du sol une fois attelé
    flashTip(`🔧 Attelage de la <b>${TOOL_LABEL[near.type]}</b>…`);
    attachToolAnimated(near.type, ()=>{
      if(tractor.refueled){
        const msg = workMode==='fence' ? "Entre dans le champ et fais le <b>tour complet</b> pour poser la clôture."
                                        : "Entre dans le champ par le <b>portail</b> et travaille toute la parcelle.";
        setObjective(workMode==='fence'?"🚧 Fais le tour du champ.":"🚜 Travaille tout le champ.");
        showInfo('🚜','Outil prêt !', msg, ()=>startDriverView());
      } else {
        setObjective("⛽ Va faire le plein à la citerne (bas, au centre).");
        showInfo('⛽','Fais le plein !',
          "Bon outil attelé ! Avant de travailler, va faire le <b>plein de gasoil</b> à la <b>citerne</b>, en bas au centre du champ.",
          null, "Compris");
      }
    });
  } else {
    const tm=makeTool(near.type,1.9,false); tractor.group.userData.anchor.add(tm); tractor.toolMesh=tm;
    setObjective(`🔧 Mauvais outil. Il te faut : ${TOOL_LABEL[need]}.`);
    flashTip(`Ce n'est pas le bon outil pour cette tâche. Il te faut la <b>${TOOL_LABEL[need]}</b> — recule dessus.`);
  }
}
// Petite animation : l'outil descend et se cale à l'arrière du tracteur
function attachToolAnimated(type, cb){
  const tm=makeTool(type,1.9,false); tractor.group.userData.anchor.add(tm); tractor.toolMesh=tm;
  tm.position.set(0,2.4,-1.3);                 // arrive du dessus/arrière
  toolAnim={mesh:tm,t:0,dur:0.85,from:{x:0,y:2.4,z:-1.3},cb};
}
function updateToolAnim(dt){
  if(!toolAnim) return;
  toolAnim.t+=dt; const u=Math.min(1,toolAnim.t/toolAnim.dur), e=1-Math.pow(1-u,2.2), f=toolAnim.from;
  toolAnim.mesh.position.set(f.x*(1-e), f.y*(1-e), f.z*(1-e));
  if(u>=1){ toolAnim.mesh.position.set(0,0,0); const cb=toolAnim.cb; toolAnim=null; if(cb) cb(); }
}
function doWork(t,moving){
  if(!moving) return;
  if(workMode==='fence'){
    fenceSegments.forEach(s=>{ if(!s.done && Math.hypot(s.x-t.x,s.z-t.z)<PS*0.62){
      s.done=true; fencePlantedCount++; plantFencePost(s); spawnDust(t); playToolSound('fence'); updateProgress(); checkComplete(); }});
  } else {
    parcels.forEach(p=>{ if(!p.done && Math.hypot(p.x-t.x,p.z-t.z)<WORK_R){
      p.done=true; setParcelDone(p); spawnDust(t); playToolSound(p.work); updateProgress(); checkComplete(); }});
  }
}
function updateProgress(){
  const total=workMode==='fence'?fenceSegments.length:parcels.length;
  const done=workMode==='fence'?fencePlantedCount:parcels.filter(p=>p.done).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+' %';
}
function checkComplete(){
  if(levelDone) return;
  const done=workMode==='fence'?(fenceSegments.length&&fenceSegments.every(s=>s.done)):(parcels.length&&parcels.every(p=>p.done));
  if(done){ levelDone=true; setTimeout(endLevel,600); }
}

function spawnSmoke(t){
  if(t.smoke.length>44) return;
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.14,6,6),new THREE.MeshStandardMaterial({color:0x444,transparent:true,opacity:.4,roughness:1}));
  const ep=t.group.userData.exhaust.clone(); ep.applyMatrix4(t.group.matrixWorld); s.position.copy(ep); s.userData={life:1,kind:'smoke'}; scene.add(s); t.smoke.push(s);

function updateEffects(dt){
  if(!tractor) return;
  for(let i=tractor.smoke.length-1;i>=0;i--){
    const s=tractor.smoke[i]; s.userData.life-=dt*1.2;
    if(s.userData.kind==='smoke'){s.position.y+=dt*0.7;s.scale.multiplyScalar(1+dt*0.8);} else s.scale.multiplyScalar(1+dt*1.2);
    s.material.opacity=Math.max(0,s.userData.life*(s.userData.kind==='smoke'?0.4:0.5));
    if(s.userData.life<=0){scene.remove(s);s.geometry.dispose();s.material.dispose();tractor.smoke.splice(i,1);}
  }
}

function updateCameraIntro(dt){

  const a=camIntro.a0+(camIntro.aF-camIntro.a0)*e, r=camIntro.r0+(camIntro.rF-camIntro.r0)*e, h=camIntro.h0+(camIntro.hF-camIntro.h0)*e;

// Trouve l'arête du contour qui n'est PAS déjà cotée (= le côté oblique/hypoténuse)
function findObliqueEdge(){
  if(!SHAPE_GEOM || !SHAPE_GEOM.dims || !shapePoly.length) return null;
  const labeled=new Set(SHAPE_GEOM.dims.map(d=>Math.min(d.a,d.b)+'-'+Math.max(d.a,d.b)));
  for(let i=0;i<shapePoly.length;i++){
    const j=(i+1)%shapePoly.length, key=Math.min(i,j)+'-'+Math.max(i,j);
    if(!labeled.has(key)) return [shapePoly[i],shapePoly[j]];
  }
  return null;
}
// Triangle rectangle de construction (h et B−b) qui donne le côté oblique par Pythagore — affiché en rouge
function showPythTriangle(){
  hidePythTriangle();
  if(!SHAPE.hasPyth || !shapePoly.length) return;
  const mat=new THREE.MeshStandardMaterial({color:0xe8402a,emissive:0x5a1208,emissiveIntensity:.55,roughness:.5});
  let Ap,Bp,Cp,ux,uz,pux,puz;
  if(SHAPE.pythVerts){
    // Sommets réels explicites (angle droit, puis les deux extrémités de l'hypoténuse) : pas de point projeté.
    const [iAp,iBp,iCp]=SHAPE.pythVerts;
    Ap=shapePoly[iAp]; Bp=shapePoly[iBp]; Cp=shapePoly[iCp];
    const dlenA=Math.hypot(Bp.x-Ap.x,Bp.z-Ap.z)||1; ux=(Bp.x-Ap.x)/dlenA; uz=(Bp.z-Ap.z)/dlenA;
    const dlenB=Math.hypot(Cp.x-Ap.x,Cp.z-Ap.z)||1; pux=(Cp.x-Ap.x)/dlenB; puz=(Cp.z-Ap.z)/dlenB;
  } else {
    const edge=findObliqueEdge(); if(!edge) return;
    [Bp,Cp]=edge;
    let idxB=-1; for(let i=0;i<shapePoly.length;i++) if(shapePoly[i]===Bp) idxB=i;
    const A0=shapePoly[(idxB-1+shapePoly.length)%shapePoly.length];
    const dirx=Bp.x-A0.x, dirz=Bp.z-A0.z, dlen=Math.hypot(dirx,dirz);
    if(dlen<0.01) return;
    ux=dirx/dlen; uz=dirz/dlen;
    const t=(Cp.x-A0.x)*ux+(Cp.z-A0.z)*uz;
    Ap={x:A0.x+t*ux, z:A0.z+t*uz};                      // point projeté (angle droit)
    const perp={x:Cp.x-Ap.x, z:Cp.z-Ap.z}, plen=Math.hypot(perp.x,perp.z)||1;
    pux=perp.x/plen; puz=perp.z/plen;
  }
  pythTri=new THREE.Group();
  addBar(Bp.x,Bp.z,Ap.x,Ap.z,mat,pythTri,0.16,0.13);     // 1er côté
  addBar(Ap.x,Ap.z,Cp.x,Cp.z,mat,pythTri,0.16,0.13);     // 2e côté
  addBar(Bp.x,Bp.z,Cp.x,Cp.z,mat,pythTri,0.2,0.16);      // hypoténuse / côté oblique cherché
  // petit carré d'angle droit au sommet Ap
  const rs=0.55;
  const cornerGeo=new THREE.BufferGeometry();
  const p0=Ap, p1={x:Ap.x+ux*rs,z:Ap.z+uz*rs}, p2={x:Ap.x+ux*rs+pux*rs,z:Ap.z+uz*rs+puz*rs}, p3={x:Ap.x+pux*rs,z:Ap.z+puz*rs};
  cornerGeo.setAttribute('position',new THREE.Float32BufferAttribute([p0.x,0.14,p0.z, p1.x,0.14,p1.z, p2.x,0.14,p2.z, p3.x,0.14,p3.z],3));
  cornerGeo.setIndex([0,1,2, 0,2,3]); cornerGeo.computeVertexNormals();
  const corner=new THREE.Mesh(cornerGeo,new THREE.MeshStandardMaterial({color:0xe8402a,transparent:true,opacity:.5,side:THREE.DoubleSide}));
  pythTri.add(corner);
  scene.add(pythTri);
}
function hidePythTriangle(){ if(pythTri){ scene.remove(pythTri); pythTri=null; } }
function drawDiagonal(){
  if(diagonalMesh){ scene.remove(diagonalMesh); diagonalMesh=null; }
  const edge=findObliqueEdge();
  if(!edge) return;                                     // pas d'arête fiable trouvée : ne rien tracer (plutôt qu'une diagonale fausse)
  const mat=new THREE.MeshStandardMaterial({color:0xe8d048,emissive:0x444400,roughness:.6});
  const [A,B]=edge;
  diagonalMesh=new THREE.Group();
  addBar(A.x,A.z,B.x,B.z,mat,diagonalMesh,0.22,0.14);
  scene.add(diagonalMesh);
}

function makeDimLabel(text){
  const cv=document.createElement('canvas'); cv.width=210; cv.height=64; const c=cv.getContext('2d');
  c.fillStyle='rgba(255,255,255,0.96)'; c.strokeStyle='#1a1a1a'; c.lineWidth=4;
  c.beginPath(); c.rect(3,3,204,58); c.fill(); c.stroke();
  c.font='bold 34px Lato, sans-serif'; c.fillStyle='#1a1a1a'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text,105,34);
  const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(3.0,0.92,1); sp.renderOrder=999; return sp;
}
function addBar(ax,az,bx,bz,mat,grp,w,y){
  const len=Math.hypot(bx-ax,bz-az); if(len<0.02)return;
  const bar=new THREE.Mesh(new THREE.BoxGeometry(len,0.08,w),mat);
  bar.position.set((ax+bx)/2,y===undefined?0.5:y,(az+bz)/2); bar.rotation.y=-Math.atan2(bz-az,bx-ax); grp.add(bar);
}
function makeDimEdge(A,B,off,text,grp){
  const s=1.4, ox=off.x*s, oz=off.z*s;
  const a2={x:A.x+ox,z:A.z+oz}, b2={x:B.x+ox,z:B.z+oz};
  const mat=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.6});
  addBar(a2.x,a2.z,b2.x,b2.z,mat,grp,0.09);        // ligne de cote
  addBar(A.x,A.z,a2.x,a2.z,mat,grp,0.05);          // lignes d'extension
  addBar(B.x,B.z,b2.x,b2.z,mat,grp,0.05);
  const dx=b2.x-a2.x, dz=b2.z-a2.z, L=Math.hypot(dx,dz);
  if(L>0.02){ const ux=dx/L, uz=dz/L;
    addArrow(a2.x,a2.z,-ux,-uz,mat,grp);           // flèches aux extrémités
    addArrow(b2.x,b2.z, ux, uz,mat,grp);
  }
  const sp=makeDimLabel(text); sp.position.set((a2.x+b2.x)/2,1.6,(a2.z+b2.z)/2); grp.add(sp);
}
function addArrow(px,pz,dx,dz,mat,grp){
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.6,10),mat);
  cone.position.set(px,0.5,pz);
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(dx,0,dz).normalize());
  grp.add(cone);
}
function showDims(){
  hideDims();
  if(!SHAPE_GEOM || !SHAPE_GEOM.dims || !shapePoly.length) return;
  dimAnnos=new THREE.Group();
  SHAPE_GEOM.dims.forEach(d=>makeDimEdge(shapePoly[d.a],shapePoly[d.b],d.off,d.text,dimAnnos));
  scene.add(dimAnnos);
}
function hideDims(){ if(dimAnnos){ scene.remove(dimAnnos); dimAnnos=null; } }
let tipTimer=null;
function flashTip(html){ const t=document.getElementById('tip'); t.innerHTML=html; t.style.borderColor='var(--gold)'; clearTimeout(tipTimer); tipTimer=setTimeout(()=>t.style.borderColor='var(--border)',3000); }

function endLevel(){
  const penalty=mathErrors+hintsUsed;
  let stars=penalty===0?3:penalty<=2?2:1;
  const starsStr='★'.repeat(stars)+'☆'.repeat(3-stars);
  const lvl=LEVELS[currentLevel];
  document.getElementById('end-tag').textContent=lvl.name;
  document.getElementById('end-title').textContent=stars===3?'Parcelle impeccable !':stars===2?'Bon travail !':'Niveau terminé';
  document.getElementById('end-stars').textContent=starsStr;
  document.getElementById('end-stats').textContent=
    `Forme            : ${SHAPE.label}\nCalculs          : ${levelTasks.length}\nErreurs de calcul: ${mathErrors}\nIndices utilisés : ${hintsUsed}`;
  const btn=document.getElementById('end-btn'), last=currentLevel>=LEVELS.length-1;
  btn.textContent=last?'Terminer la saison':'Niveau suivant →';
  btn.onclick=last?showFinal:nextLevel;
  document.getElementById('modal-end').classList.add('active');
}
function nextLevel(){ document.getElementById('modal-end').classList.remove('active'); currentLevel++; loadLevel(); }
function showFinal(){
  document.getElementById('modal-end').classList.remove('active');
  markShapeDone(currentShapeId);
  document.getElementById('screen-game').style.display='none';
  const s=document.getElementById('screen-title'); s.style.display='flex';
  const unlockMsg = currentShapeId==='rect' ? 'Le Niveau 2 (trapèze rectangle) est débloqué !'
                   : currentShapeId==='trap' ? 'Le Niveau 3 (champ triangulaire) est débloqué !' : null;
  s.innerHTML=`<div class="finish-box">
      <div class="t-label">Saison terminée</div><h1 class="title">Agro<span>Math</span></h1>
      <p class="t-desc" style="margin:0">Tu as terminé le ${SHAPE.label.toLowerCase()} — les ${LEVELS.length} travaux sont bouclés !
      ${unlockMsg?'<br><b style="color:var(--gold)">'+unlockMsg+'</b>':''}</p>
      <button class="btn" onclick="location.reload()">Nouvelle saison</button>
    </div>`;
}
</script>
